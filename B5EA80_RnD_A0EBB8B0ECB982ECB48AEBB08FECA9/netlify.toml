[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/openalex/*"
  to = "/.netlify/functions/openalex/:splat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
