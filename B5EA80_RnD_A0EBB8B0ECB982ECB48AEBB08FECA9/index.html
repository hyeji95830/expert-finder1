<script>
(()=>{
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const CURRENT_YEAR=new Date().getFullYear();
const STEPS=['검색조건 입력','검색 키워드 검토','OpenAlex 실제 검색','연구자 통합·점수화','전문가 Pool 검토'];
const state={step:0,project:{topic:'',project:'',period:5,count:20,scope:'KR',minPub:1,perKeyword:50},keywords:[],keywordSourceTopic:'',works:new Map(),authors:new Map(),candidates:[],logs:[],stats:{works:0,authors:0,passed:0},running:false};
const SESSION_KEY='rd_expert_pool_live_v2';
function saveSession(extra={}){
  try{
    const payload={
      project:state.project,
      keywords:state.keywords,apiKey:state.apiKey||'',
      keywordSourceTopic:state.keywordSourceTopic,
      step:state.step,
      ...extra
    };
    localStorage.setItem(SESSION_KEY,JSON.stringify(payload));
  }catch(e){}
}
function restoreSession(){
  try{
    const raw=localStorage.getItem(SESSION_KEY);
    if(!raw)return false;
    const s=JSON.parse(raw);
    if(s.project)state.project={...state.project,...s.project};
    if(Array.isArray(s.keywords))state.keywords=s.keywords;if(typeof s.apiKey==='string')state.apiKey=s.apiKey;
    if(typeof s.keywordSourceTopic==='string')state.keywordSourceTopic=s.keywordSourceTopic;
    // 새 접속 시 이전 진행단계는 복원하지 않음
    state.step=0;
    return true;
  }catch(e){return false}
}
function setPendingSearch(v){
  try{localStorage.setItem(SESSION_KEY+'_pending',v?'1':'0')}catch(e){}
}
function hasPendingSearch(){
  try{return localStorage.getItem(SESSION_KEY+'_pending')==='1'}catch(e){return false}
}
function hasHangul(s){return /[가-힣]/.test(String(s||''))}
function chooseKoreanName(authorDetail,fallback){
  const candidates=[
    authorDetail?.display_name,
    ...(authorDetail?.display_name_alternatives||[]),
    ...(authorDetail?.raw_author_names||[])
  ].filter(Boolean);
  return candidates.find(hasHangul)||fallback;
}
async function enrichKoreanNames(){
  const targets=state.candidates.filter(c=>c.country==='KR' && c.id).slice(0,8);
  if(!targets.length)return;
  addLog(`국내 연구자 ${targets.length}명의 한글 이름 표기 확인 중…`);
  for(let i=0;i<targets.length;i+=5){
    const chunk=targets.slice(i,i+5);
    await Promise.all(chunk.map(async c=>{
      try{
        const aid=c.id.split('/').pop();
        const u=`/api/openalex/authors/${aid}?select=id,display_name,display_name_alternatives${state.apiKey?'&api_key='+encodeURIComponent(state.apiKey):''}`;
        const d=await fetchJSON(u);
        const ko=chooseKoreanName(d,c.name);
        if(ko && ko!==c.name && hasHangul(ko)){
          c.name_original=c.name;
          c.name=ko;
        }
      }catch(e){}
    }));
    await new Promise(r=>setTimeout(r,200));
  }
  const converted=targets.filter(c=>hasHangul(c.name)).length;
  addLog(`한글 이름 확인 완료 · ${converted}명 한글 표기 적용`,'ok');
}

const dict=[

 {keys:['배터리','이차전지','전고체','리튬이온','battery'], kws:['secondary battery','lithium ion battery','solid state battery','battery materials','battery management system','electrochemical energy storage']},

 {keys:['자율주행','자동차','모빌리티','autonomous driving'], kws:['autonomous driving','autonomous vehicle','intelligent transportation system','vehicle perception','vehicle control']},

 {keys:['원자력','원전','소형모듈원자로','smr'], kws:['nuclear energy','small modular reactor','nuclear reactor safety','advanced nuclear reactor','nuclear fuel']},

 {keys:['풍력','wind'], kws:['wind energy','wind turbine','offshore wind','wind power generation']},
 {keys:['소재','신소재','첨단소재','materials'], kws:['advanced materials','materials science','functional materials','nanomaterials']},

 {keys:['바이오마커','biomarker'], kws:['biomarker','molecular biomarker','clinical biomarker','omics biomarker']},

 {keys:['합성생물학','synthetic biology'], kws:['synthetic biology','metabolic engineering','genetic circuit','biofoundry']},
 {keys:['사이버보안','보안','cybersecurity'], kws:['cybersecurity','information security','network security','cryptography','zero trust']},
 {keys:['6g','통신','이동통신','무선통신'], kws:['6G communication','wireless communication','mobile communication','terahertz communication','massive MIMO']},

function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function setStep(n){state.step=n;saveSession();render()}
function renderRail(){ $('#rail').innerHTML=STEPS.map((s,i)=>`<div class="step ${i===state.step?'active':''} ${i<state.step?'done':''}"><b>${i<state.step?'✓':i+1}</b>${s}</div>`).join('') }
function suggestKeywords(topic){
  const clean=String(topic||'').trim();
  const low=clean.toLowerCase();
  let out=[];

  // 1) 분야 사전에서 입력 주제와 일치하는 학술용어 구성
  dict.forEach(d=>{
    if(d.keys.some(k=>low.includes(k.toLowerCase()))) out.push(...d.kws);
  });

  // 2) 사용자가 직접 쓴 영문 학술용어가 있으면 유지
  const english=(clean.match(/[A-Za-z][A-Za-z0-9+&/\- ]{2,}/g)||[])
    .map(x=>x.trim().replace(/\s+/g,' '))
    .filter(x=>x.length>=3);
  out.push(...english);

  // 3) 사전에 없는 주제도 이전 주제 키워드를 재사용하지 않고
  //    실제 입력문 자체를 검색어로 반드시 포함
  if(clean && !/[가-힣]/.test(clean)) out.unshift(clean);

  // 너무 긴 자연어 문장은 OpenAlex 검색용으로 앞부분도 보조 검색
  if(clean.length>45){
    const short=clean
      .replace(/전문가|연구자|찾고 싶다|찾고자|관련|분야|연구/g,' ')
      .replace(/\s+/g,' ')
      .trim()
      .slice(0,80);
    if(short) out.unshift(short);
  }

  return [...new Set(out.filter(Boolean))].slice(0,6);
}

<div class="field"><label>사업·연구명</label><input id="project" value="${esc(state.project.project)}" placeholder="예: 국립건강노화연구소 R&D 로드맵 수립"></div>

function addLog(msg,cls=''){state.logs.push({msg,cls});renderLogs()}
function renderLogs(){const l=$('#log');if(!l)return;l.innerHTML=state.logs.map(x=>`<div class="${x.cls}">▸ ${esc(x.msg)}</div>`).join('');l.scrollTop=l.scrollHeight}
function progress(p){const b=$('#bar');if(b)b.style.width=Math.max(0,Math.min(100,p))+'%'}
function apiSearchUrl(keyword,from,to,per,page=1){
  const u=new URL('/api/openalex/works', window.location.origin);
  u.searchParams.set('search',keyword);
  u.searchParams.set('filter',`from_publication_date:${from},to_publication_date:${to}`);
  u.searchParams.set('sort','relevance_score:desc');
  u.searchParams.set('per_page',String(Math.min(100,per)));
  u.searchParams.set('page',String(page));
  u.searchParams.set('select','id,title,display_name,publication_year,publication_date,cited_by_count,doi,authorships,primary_topic');
  if(state.apiKey)u.searchParams.set('api_key',state.apiKey);
  return u.toString();
}
async function fetchJSON(url){
  const ctl=new AbortController();
  const tm=setTimeout(()=>ctl.abort(),30000);
  try{
    const r=await fetch(url,{signal:ctl.signal,headers:{'Accept':'application/json'}});
    const data=await r.json().catch(()=>({}));
    if(!r.ok){const msg=data?.message||data?.error||'요청 실패';const er=new Error(`HTTP ${r.status}: ${typeof msg==='string'?msg:JSON.stringify(msg)}`);er.status=r.status;throw er;}
    return data;
  }catch(e){
    if(e.name==='AbortError') throw new Error('검색 응답시간이 초과되었습니다.');
    if(e instanceof TypeError)throw new Error('웹사이트 검색 서버에 연결하지 못했습니다. 잠시 후 다시 시도해 주세요.');
    throw e;
  }finally{clearTimeout(tm)}
}
async function startSearch(){
  state.keywords=state.keywords.map(x=>x.trim()).filter(Boolean);
  if(!state.keywords.length){alert('검색 키워드를 1개 이상 입력해 주세요.');return}
  setPendingSearch(true);state.step=2;saveSession({step:2});
  state.logs=[];
  state.works=new Map();
  state.authors=new Map();
  state.candidates=[];
  state.stats={works:0,authors:0,passed:0};
  render();

  const from=`${CURRENT_YEAR-state.project.period}-01-01`;
  const to=`${CURRENT_YEAR}-12-31`;

  addLog('OpenAlex 실제 학술데이터 검색을 시작합니다. (웹 서버 연동)');
  addLog(`검색기간: ${from} ~ ${to}`);
  let success=0;let fatalError='';

  const searchKeywords=state.keywords.slice(0,5);
  if(state.keywords.length>5)addLog('요청 한도 보호를 위해 상위 5개 키워드만 검색합니다.');
  // 국내 소속 조건에 따라 전체 저자 수와 적격 연구자 수는 크게 다를 수 있습니다.
  // 1페이지 검색 후 적격 인원이 부족하면 실제 OpenAlex 논문을 추가 페이지에서 수집합니다.
  const targetCount=Number(state.project.count)||50;
  const desiredPool=Math.max(targetCount,Math.ceil(targetCount*1.3));
  const maxPagesPerKeyword=5; // 키워드별 최대 5페이지. API 사용량 보호
  const nextPages=searchKeywords.map(()=>1);
  const exhausted=searchKeywords.map(()=>false);
  const totals=searchKeywords.map(()=>Infinity);
  let rateLimited=false;
  for(let round=1;round<=maxPagesPerKeyword;round++){
    for(let i=0;i<searchKeywords.length;i++){
      if(exhausted[i])continue;
      const kw=searchKeywords[i],page=nextPages[i];
      addLog(`[${kw}] 논문 검색 ${page}페이지 중…`);
      try{
        const j=await fetchJSON(apiSearchUrl(kw,from,to,state.project.perKeyword,page));
        const rs=j.results||[];
        success++;
        totals[i]=Number.isFinite(Number(j.meta?.count))?Number(j.meta.count):Infinity;
        addLog(`[${kw}] ${page}페이지 실제 논문 ${rs.length}편 수집`,'ok');
        rs.forEach(w=>ingestWork(w,kw));
        nextPages[i]++;
        if(!rs.length || page*state.project.perKeyword>=totals[i] || rs.length<state.project.perKeyword)exhausted[i]=true;
      }catch(e){
        addLog(`[${kw}] ${page}페이지 실패: ${e.message}`,'err');
        exhausted[i]=true;
        if([400,401,402,403,429].includes(e.status)){
          fatalError=e.message;
          addLog('OpenAlex 인증·사용량 제한으로 추가 검색을 중단합니다.','err');
          rateLimited=true;break;
        }
      }
      await new Promise(r=>setTimeout(r,450));
    }
    // 매 라운드마다 실제 저자·논문을 기준으로 필터 통과 인원을 다시 계산합니다.
    if(state.works.size){aggregate();addLog(`현재 ${state.works.size}편 · 전체 저자 ${state.authors.size}명 · 조건 충족 ${state.stats.passed}명 (목표 ${targetCount}명)`,'ok');}
    progress(Math.min(75,Math.round(round/maxPagesPerKeyword*75)));
    if(state.stats.passed>=desiredPool){addLog(`조건 충족 연구자 ${state.stats.passed}명 확보 · 추가 검색 종료`,'ok');break;}
    if(exhausted.every(Boolean)||rateLimited)break;
    addLog(`선정 가능 인원이 목표보다 부족하여 추가 논문을 검색합니다. (${round+1}/${maxPagesPerKeyword}차)`);
  }
  if(state.stats.passed<targetCount && success){
    addLog(`목표 ${targetCount}명 중 실제 조건 충족 ${state.stats.passed}명만 확보했습니다. 가상 인원은 추가하지 않습니다.`,'err');
  }

  if(!success || state.works.size===0){
    setPendingSearch(false);saveSession({step:2});
    addLog('실제 검색 결과를 가져오지 못했습니다. 가상 데이터로 대체하지 않습니다.','err');
    const a=$('#retryArea');
    if(a)a.innerHTML=`<div class="alert red"><b>OpenAlex 검색 실패</b><br>
    ${esc(fatalError||'요청 실패: 브라우저 개발자도구(F12)에서 네트워크 오류를 확인해 주세요.')}<br>웹사이트에서 실행하면 검색 서버를 통해 OpenAlex에 연결됩니다.</div>
    <button class="btn secondary" id="retrySearch">다시 검색</button>
    <button class="btn secondary" id="editKeyword">← 키워드 수정</button>`;
    const r=$('#retrySearch'); if(r)r.onclick=startSearch;
    const e=$('#editKeyword'); if(e)e.onclick=()=>setStep(1);
    return;
  }

  addLog(`논문 ID 중복 제거 후 ${state.works.size}편`,'ok');
  addLog(`실제 저자 ${state.authors.size}명 추출`,'ok');
  progress(82);

  aggregate();
  progress(86);
  if(state.apiKey)await enrichKoreanNames();else addLog('추가 API 요청을 줄이기 위해 한글 이름 보완 조회를 생략했습니다.','ok');
  progress(100);
  addLog(`필터 통과 ${state.stats.passed}명 · 전문가 점수화 완료`,'ok');
  setPendingSearch(false);
  saveSession({step:3});
  setTimeout(()=>setStep(3),600);
}
function ingestWork(w,kw){if(!w?.id)return;if(!state.works.has(w.id))state.works.set(w.id,w);(w.authorships||[]).forEach(a=>{if(!a?.author?.id)return;const aid=a.author.id;let au=state.authors.get(aid);if(!au){au={id:aid,name:a.author.display_name||'미상',workIds:new Set(),keywords:new Set(),institutions:new Map()};state.authors.set(aid,au)}au.workIds.add(w.id);au.keywords.add(kw);(a.institutions||[]).forEach(ins=>{if(ins?.id)au.institutions.set(ins.id,ins)})})}
function aggregate(){const arr=[];for(const au of state.authors.values()){const works=[...au.workIds].map(id=>state.works.get(id)).filter(Boolean);const years=works.map(w=>w.publication_year).filter(Boolean);const citations=works.reduce((s,w)=>s+(w.cited_by_count||0),0);const insts=[...au.institutions.values()];let preferred=insts.find(x=>x.country_code==='KR')||insts[0]||null;const country=preferred?.country_code||'';if(state.project.scope==='KR' && !insts.some(x=>x.country_code==='KR'))continue;if(works.length<state.project.minPub)continue;arr.push({id:au.id,name:au.name,institution:preferred?.display_name||'',country:country,relevant_publications:works.length,citations,first_year:years.length?Math.min(...years):null,last_year:years.length?Math.max(...years):null,keywords:au.keywords,works:[...works].sort((a,b)=>(b.cited_by_count||0)-(a.cited_by_count||0)),status:'CANDIDATE'})}
const maxP=Math.max(1,...arr.map(x=>x.relevant_publications)),maxC=Math.max(1,...arr.map(x=>x.citations));arr.forEach(c=>{const recent=c.works.filter(w=>(w.publication_year||0)>=CURRENT_YEAR-2).length;const span=c.first_year&&c.last_year?c.last_year-c.first_year+1:1;const kwCoverage=Math.min(1,c.keywords.size/Math.max(1,state.keywords.length));const scRel=Math.round(Math.min(1,c.relevant_publications/maxP)*40);const scRecent=Math.round(Math.min(1,recent/5)*25);const scSpan=Math.round(Math.min(1,span/state.project.period)*15);const scCit=Math.round(Math.sqrt(c.citations/maxC)*10);const scFocus=Math.round(kwCoverage*10);c.score=scRel+scRecent+scSpan+scCit+scFocus;c.scoreParts={scRel,scRecent,scSpan,scCit,scFocus}});arr.sort((a,b)=>b.score-a.score||b.relevant_publications-a.relevant_publications||b.citations-a.citations);arr.slice(0,state.project.count).forEach(x=>x.status='SELECTED');state.candidates=arr.slice(0,Math.max(state.project.count*3,60));state.stats={works:state.works.size,authors:state.authors.size,passed:arr.length}}

e;render();openPanel(i)}}
function closePanel(){$('#overlay').classList.remove('open');$('#panel').classList.remove('open')}
function exportRows(){const s=state.candidates.filter(x=>x.status==='SELECTED');return (s.length?s:state.candidates).map((c,i)=>({'No.':i+1,'성명':c.name,'소속기관':c.institution,'국가':c.country,'관련논문수':c.relevant_publications,'관련연구기간':`${c.first_year||''}-${c.last_year||''}`,'관련인용수':c.citations,'매칭키워드':[...c.keywords].join('; '),'Expert Score':c.score,'대표논문1':(c.works[0]?.title||c.works[0]?.display_name)||'','대표논문2':(c.works[1]?.title||c.works[1]?.display_name)||'','대표논문3':(c.works[2]?.title||c.works[2]?.display_name)||'','OpenAlex URL':`https://openalex.org/${c.id.split('/').pop()}`,'검토상태':c.status}))}
function exportCSV(){const rows=exportRows();if(!rows.length)return;const hs=Object.keys(rows[0]);const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const csv='\ufeff'+[hs.map(q).join(','),...rows.map(r=>hs.map(h=>q(r[h])).join(','))].join('\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(state.project.project||'전문가Pool')+'_전문가후보.csv';a.click();URL.revokeObjectURL(a.href)}
function exportExcel(){if(window.XLSX){const ws=XLSX.utils.json_to_sheet(exportRows());const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'전문가Pool');XLSX.writeFile(wb,(state.project.project||'전문가Pool')+'_전문가후보.xlsx')}else{exportCSV();alert('Excel 라이브러리를 불러오지 못해 CSV로 저장했습니다.')}}
const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.async=true;document.head.appendChild(s);
restoreSession();
// 이전 검색이 중단되어도 접속할 때 자동 재실행하지 않음
state.step=0;
setPendingSearch(false);
render();
})();
